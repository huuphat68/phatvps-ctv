<style>
  :root {
    --bg: #f5f8ff;
    --card: #ffffff;
    --border: #dbe5f3;

    --text: #0f172a;
    --muted: #64748b;

    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff6ff;

    --secondary: #e8eef8;
    --secondary-text: #1e3a8a;

    --success: #15803d;
    --warning: #d97706;
    --danger: #dc2626;
    --danger-hover: #b91c1c;

    --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }


  * {
    box-sizing: border-box;
  }


  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }


  .w {
    max-width: 1320px;
    margin: auto;
    padding: 22px;
  }


  h1 {
    margin: 6px 0 18px;
    color: var(--text);
    font-size: 30px;
    letter-spacing: -0.5px;
  }


  h2 {
    margin-top: 0;
    color: var(--text);
  }


  /* CARD */

  .card {
    margin: 12px 0;
    padding: 16px;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 16px;

    box-shadow: var(--shadow);
  }


  /* DASHBOARD GRID */

  .grid {
    display: grid;
    grid-template-columns: repeat(
      auto-fit,
      minmax(180px, 1fr)
    );
    gap: 10px;
  }


  .grid .card {
    margin: 0;
    min-height: 105px;

    display: flex;
    flex-direction: column;
    justify-content: center;
  }


  .k {
    margin-top: 5px;

    color: var(--primary);

    font-size: 24px;
    font-weight: 800;
  }


  .m {
    color: var(--muted);
  }


  .small {
    font-size: 12px;
  }


  /* INPUT */

  input,
  select,
  button {
    padding: 10px;

    border-radius: 10px;

    font: inherit;
  }


  input,
  select {
    background: #ffffff;
    color: var(--text);

    border: 1px solid #cbd5e1;

    outline: none;
  }


  input:focus,
  select:focus {
    border-color: var(--primary);

    box-shadow:
      0 0 0 3px rgba(37, 99, 235, 0.10);
  }


  /* BUTTON */

  button {
    background: var(--primary);
    color: #ffffff;

    border: 0;

    cursor: pointer;

    font-weight: 700;

    transition: 0.15s;
  }


  button:hover {
    background: var(--primary-hover);
  }


  .sec {
    background: var(--secondary);
    color: var(--secondary-text);
  }


  .sec:hover {
    background: #dce6f5;
  }


  .danger {
    background: var(--danger);
    color: #ffffff;
  }


  .danger:hover {
    background: var(--danger-hover);
  }


  .ghost {
    background: var(--primary-soft);
    color: #1d4ed8;
  }


  .ghost:hover {
    background: #dbeafe;
  }


  /* FLEX ROW */

  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }


  .row > * {
    flex: 1;
    min-width: 130px;
  }


  /* TABLE */

  table {
    width: 100%;
    border-collapse: collapse;
  }


  th,
  td {
    padding: 9px;

    border-bottom: 1px solid #e5edf7;

    text-align: left;
    vertical-align: middle;
  }


  th {
    background: #f8faff;

    color: #334155;

    font-weight: 700;
  }


  tbody tr:hover {
    background: #f8fbff;
  }


  /* KEY BOX / TIMELINE */

  .keybox {
    margin-top: 12px;
    padding: 14px;

    background: #f8faff;

    border: 1px solid #bfdbfe;
    border-radius: 12px;

    color: var(--text);

    line-height: 1.7;
  }


  /* STATUS BADGES */

  .badge {
    display: inline-block;

    padding: 4px 9px;

    border-radius: 999px;

    background: #eef2f7;

    font-weight: 700;
  }


  .badge.paid {
    background: #ecfdf5;
    color: var(--success);
  }


  .badge.pending {
    background: #fff7ed;
    color: var(--warning);
  }


  .badge.cancelled {
    background: #fef2f2;
    color: var(--danger);
  }


  /*
    Giữ tương thích với class:
    class="badge paid"
  */

  .paid {
    color: var(--success);
  }


  .pending {
    color: var(--warning);
  }


  .cancelled {
    color: var(--danger);
  }


  /* DETAILS */

  details {
    padding: 4px 12px;

    background: #f8faff;

    border: 1px solid var(--border);
    border-radius: 12px;
  }


  details summary {
    padding: 8px 0;

    color: #1e3a8a;

    cursor: pointer;

    font-weight: 700;
  }


  /* TOOLBAR */

  .toolbar {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    align-items: center;
  }


  .toolbar input {
    min-width: 220px;
    flex: 1;
  }


  .toolbar select {
    background: #ffffff;
  }


  .toolbar label {
    display: flex;

    align-items: center;

    gap: 6px;
  }


  .toolbar label input[type="checkbox"] {
    width: auto;
  }


  /* HIDE */

  .hide {
    display: none;
  }


  /* MOBILE */

  @media (max-width: 800px) {

    .grid {
      grid-template-columns: 1fr 1fr;
    }

  }


  @media (max-width: 520px) {

    .w {
      padding: 12px;
    }


    .grid {
      grid-template-columns: 1fr;
    }


    h1 {
      font-size: 25px;
    }


    .card {
      padding: 14px;

      border-radius: 14px;
    }

  }
</style>
