<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Đặt VPS · Hữu Phát VPS</title>

  <style>
    body {
      margin: 0;
      background: #0b1120;
      color: #e5e7eb;
      font: 15px system-ui;
    }

    .w {
      max-width: 650px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: #111827;
      border: 1px solid #25324a;
      border-radius: 18px;
      padding: 20px;
      margin: 14px 0;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0 12px;
      border-radius: 12px;
      border: 1px solid #25324a;
      background: #0b1220;
      color: #e5e7eb;
    }

    button {
      background: #16a34a;
      border: 0;
      font-weight: 800;
      cursor: pointer;
    }

    .m {
      color: #94a3b8;
    }

    .code {
      font: 800 24px ui-monospace, monospace;
      letter-spacing: 1px;
    }

    .hide {
      display: none;
    }

    .qr {
      display: block;
      width: min(320px, 100%);
      margin: 14px auto;
      border-radius: 16px;
      background: white;
    }

    .payment-info {
      line-height: 1.8;
      margin-top: 18px;
    }

    .warning {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #25324a;
      color: #fbbf24;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="w">

    <h1>Đặt VPS</h1>

    <!-- FORM TẠO ĐƠN -->
    <div id="form" class="card">

      <div id="refInfo" class="m"></div>

      <label>Gói</label>
      <select id="plan"></select>

      <label>Tên / biệt danh</label>
      <input id="name">

      <label>Zalo / liên hệ</label>
      <input id="contact">

      <button onclick="createOrder()">
        Tạo đơn & QR thanh toán
      </button>

      <div id="msg" class="m"></div>

    </div>


    <!-- THANH TOÁN -->
    <div id="pay" class="card hide">

      <h2>Quét QR để thanh toán</h2>

      <img
        id="qr"
        class="qr"
        alt="QR chuyển khoản"
      >

      <div class="payment-info">

        <div>
          Ngân hàng:
          <b id="bankName"></b>
        </div>

        <div>
          STK:
          <b id="bankAccount"></b>
        </div>

        <div>
          Chủ TK:
          <b id="bankOwner"></b>
        </div>

        <div>
          Số tiền:
          <b id="amount"></b>
        </div>

      </div>

      <p>Nội dung chuyển khoản:</p>

      <div
        class="code"
        id="paymentCode"
      ></div>

      <button onclick="copyCode()">
        Sao chép nội dung
      </button>

      <div class="warning">
        ⚠️ Hữu Phát VPS chỉ nhận thanh toán qua tài khoản ngân hàng
        hiển thị phía trên. Nếu thông tin tài khoản khác,
        vui lòng không chuyển tiền.
      </div>

    </div>

  </div>


  <script src="config.js"></script>

  <script>
    const API = window.PHATVPS_API_BASE || "";

    const ref =
      new URLSearchParams(location.search).get("ref") || "";

    const fmt = n =>
      Number(n || 0).toLocaleString("vi-VN") + "đ";

    let BANK = {};


    async function get(path) {
      const response = await fetch(API + path);

      if (!response.ok) {
        throw 0;
      }

      return response.json();
    }


    function vietQr(amount, code) {

      const bank =
        (BANK.name || "MB")
          .toUpperCase()
          .includes("MB")
          ? "MB"
          : BANK.name;

      return (
        "https://img.vietqr.io/image/" +
        encodeURIComponent(bank) +
        "-" +
        encodeURIComponent(BANK.account) +
        "-compact2.png" +
        "?amount=" +
        encodeURIComponent(amount) +
        "&addInfo=" +
        encodeURIComponent(code) +
        "&accountName=" +
        encodeURIComponent(BANK.owner || "")
      );
    }


    async function init() {

      const [plansData, configData] =
        await Promise.all([
          get("/api/public/plans"),
          get("/api/public/config")
        ]);

      BANK = configData.bank || {};


      document.getElementById("plan").innerHTML =
        (plansData.plans || [])
          .map(plan => `
            <option value="${plan.code}">
              ${plan.name} · ${fmt(plan.amount)}
            </option>
          `)
          .join("");


      document.getElementById("refInfo").textContent =
        ref
          ? "Đơn này có mã giới thiệu: " + ref
          : "Đơn trực tiếp";


      document.getElementById("bankName").textContent =
        BANK.name || "";

      document.getElementById("bankAccount").textContent =
        BANK.account || "";

      document.getElementById("bankOwner").textContent =
        BANK.owner || "";
    }


    async function createOrder() {

      const body = {
        plan_code:
          document.getElementById("plan").value,

        customer_name:
          document.getElementById("name").value,

        customer_contact:
          document.getElementById("contact").value,

        ref
      };


      const response =
        await fetch(API + "/api/orders", {
          method: "POST",

          headers: {
            "content-type": "application/json"
          },

          body: JSON.stringify(body)
        });


      const data = await response.json();


      if (!response.ok) {

        document.getElementById("msg").textContent =
          "Lỗi: " +
          (data.error || "không tạo được đơn");

        return;
      }


      document.getElementById("amount").textContent =
        fmt(data.amount);


      document.getElementById("paymentCode").textContent =
        data.payment_code;


      document.getElementById("qr").src =
        vietQr(
          data.amount,
          data.payment_code
        );


      document
        .getElementById("pay")
        .classList
        .remove("hide");


      document.getElementById("msg").textContent =
        "Mã đơn: " +
        data.order_code +
        (
          data.referral_applied
            ? " · Đã ghi nhận CTV"
            : ""
        );


      document
        .getElementById("pay")
        .scrollIntoView({
          behavior: "smooth"
        });
    }


    async function copyCode() {

      const code =
        document
          .getElementById("paymentCode")
          .textContent;

      await navigator.clipboard.writeText(code);
    }


    init();
  </script>

</body>
</html>
